    function showToast(msg, type = 'success') {
        let existing = document.querySelector('.toast-msg');
        if(existing) existing.remove();
        let toast = document.createElement('div');
        toast.className = `toast-msg ${type === 'error' ? 'error' : 'success'}`;
        const icon = type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle';
        toast.innerHTML = `<i class="fas ${icon}" style="margin-right: 8px;"></i>${msg}`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 4000);
    }

    async function submitToFormspree(formData) {
        try {
            const response = await fetch(FORMSPREE_ENDPOINT, { method: 'POST', body: formData, headers: { 'Accept': 'application/json' } });
            if (response.ok) return { success: true };
            else return { success: false };
        } catch (error) { return { success: false }; }
    }

    async function handleContactSubmit(e) {
        e.preventDefault();
        const form = e.target;
        const submitBtn = form.querySelector('button[type="submit"]');
        const name = form.name.value.trim(), email = form.email.value.trim(), message = form.message.value.trim(), phone = form.phone?.value.trim() || '';
        if(!name || !email || !message) { showToast("⚠️ Please fill all required fields.", 'error'); return; }
        if(!email.includes('@')) { showToast("📧 Valid email required.", 'error'); return; }
        const formData = new FormData();
        formData.append('name', name); formData.append('email', email);
        formData.append('message', `Phone: ${phone || 'Not provided'}\n\nMessage: ${message}`);
        formData.append('_subject', `Cretech Contact - ${name}`);
        submitBtn.disabled = true; submitBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Sending...';
        const result = await submitToFormspree(formData);
        if(result.success) { showToast(`✨ Thanks ${name}! We'll respond soon.`, 'success'); form.reset(); }
        else { showToast(`❌ Failed. Call +254724083199`, 'error'); }
        submitBtn.disabled = false; submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Send Message';
    }

    function renderServices() { return `<div class="container"><h2 class="section-title">Our Expertise</h2><div class="grid">${siteData.services.map(s => `<div class="service-card"><div class="service-icon"><i class="${s.icon}"></i></div><h3>${s.name}</h3><p>${s.desc}</p></div>`).join('')}</div></div>`; }
    function renderIndustries() { return `<div class="container"><h2 class="section-title">Industries We Serve</h2><div class="grid">${siteData.industriesList.map(ind => `<div class="industry-card"><i class="fas fa-industry" style="font-size:2.5rem;color:#2563EB;margin-bottom:16px;"></i><h3>${ind}</h3><p>Custom security & automation for ${ind.toLowerCase()}.</p></div>`).join('')}</div></div>`; }
    function renderPortfolio() { return `<div class="container"><h2 class="section-title">Recent Projects</h2><div class="portfolio-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:28px;">${siteData.portfolioItems.map(item => `<div class="portfolio-item" style="background:#F8FAFE;border-radius:28px;overflow:hidden;"><div class="portfolio-img" style="background:${item.bg};height:180px;display:flex;align-items:center;justify-content:center;font-size:3rem;"><i class="${item.icon}"></i></div><div class="portfolio-caption" style="padding:18px;background:white;text-align:center;"><strong>${item.title}</strong><p style="font-size:0.85rem;color:#475569;">${item.desc}</p></div></div>`).join('')}</div><p style="text-align:center;margin-top:40px;"><i class="fas fa-hard-hat"></i> Real installations across Nairobi — contact us for detailed case studies.</p></div>`; }
    function renderContact() { return `<div class="container"><h2 class="section-title">Get In Touch</h2><div class="contact-flex"><div class="contact-details"><h3><i class="fas fa-map-marker-alt"></i> Visit Us</h3><p>📍 Westlands, Nairobi, Kenya</p><p><i class="fas fa-phone"></i> +254 724 083 199</p><p><i class="fas fa-envelope"></i> info.creationstechsolutions254@gmail.com</p><hr><p><i class="fas fa-clock"></i> Mon-Fri: 8am - 6pm</p><p><i class="fas fa-headset"></i> 24/7 Emergency Support</p><div class="map-container"><iframe src="https://maps.google.com/maps?q=Westlands%2C%20Nairobi%2C%20Kenya&t=&z=14&ie=UTF8&iwloc=&output=embed" allowfullscreen></iframe></div></div><div class="contact-form"><form id="mainContactForm"><input type="text" name="name" placeholder="Full Name *" required><input type="email" name="email" placeholder="Email Address *" required><input type="tel" name="phone" placeholder="Phone Number"><textarea name="message" rows="4" placeholder="Tell us about your security needs *" required></textarea><button type="submit"><i class="fas fa-paper-plane"></i> Send Message</button></form></div></div></div>`; }

    let currentPage = "home";
    function updateActiveNav(pageId) { document.querySelectorAll('.nav-link').forEach(link => { if(link.getAttribute('data-page') === pageId) link.classList.add('active'); else link.classList.remove('active'); }); }
    function renderPage(page) {
        const app = document.getElementById('app-root'); if(!app) return;
        let content = page === 'home' ? renderHome() : page === 'about' ? renderAbout() : page === 'services' ? renderServices() : page === 'industries' ? renderIndustries() : page === 'portfolio' ? renderPortfolio() : page === 'contact' ? renderContact() : renderHome();
        app.innerHTML = content; updateActiveNav(page);
        if(page === 'home') { document.getElementById('quoteHeroBtn')?.addEventListener('click',()=>navigateTo('contact')); document.getElementById('learnMoreBtn')?.addEventListener('click',()=>navigateTo('about')); document.getElementById('contactRedirectBtn')?.addEventListener('click',()=>navigateTo('contact')); }
        if(page === 'contact') document.getElementById('mainContactForm')?.addEventListener('submit', handleContactSubmit);
    }
    function navigateTo(page) { currentPage = page; renderPage(page); window.scrollTo({ top: 0, behavior: 'smooth' }); history.pushState({ page }, '', `#${page}`); }
    function handleHashChange() { let hash = window.location.hash.slice(1); if(['home','about','services','industries','portfolio','contact'].includes(hash)) { currentPage = hash; renderPage(currentPage); } else { currentPage = 'home'; renderPage('home'); } }
    function bindGlobalNav() { document.querySelectorAll('.nav-link').forEach(link => { link.removeEventListener('click', link._listener); const handler = (e) => { e.preventDefault(); navigateTo(link.getAttribute('data-page')); }; link.addEventListener('click', handler); link._listener = handler; }); }
    const observer = new MutationObserver(() => bindGlobalNav());
    window.addEventListener('DOMContentLoaded', () => { handleHashChange(); bindGlobalNav(); observer.observe(document.getElementById('app-root'), { childList: true, subtree: true }); window.addEventListener('hashchange', handleHashChange); 
        document.getElementById('newsletterBtn')?.addEventListener('click', () => { const email = document.getElementById('newsletterEmail')?.value; if(email && email.includes('@')) { showToast('🎉 Subscribed! Stay tuned for updates.'); document.getElementById('newsletterEmail').value = ''; } else showToast('Please enter a valid email', 'error'); });
    });
</script>
