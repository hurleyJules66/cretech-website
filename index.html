<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Cretech Systems | Secure. Smart. Future-Ready. | Security & Automation Experts Nairobi</title>
    <meta name="description" content="Cretech Systems Limited - Leading provider of security systems, CCTV, access control, hydraulic bollards, ICT networking, home automation, and solar solutions in Nairobi, Kenya.">
    <meta name="keywords" content="security systems Nairobi, CCTV installation Kenya, access control, hydraulic bollards, home automation, solar panels, ICT networking, Cretech Systems">
    <meta name="author" content="Cretech Systems Limited">
    <meta property="og:title" content="Cretech Systems | Security & Automation Solutions">
    <meta property="og:description" content="Professional security systems, smart automation, and solar energy solutions for homes, offices, and industries.">
    <meta property="og:type" content="website">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://cretechsystems.co.ke">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            color: #1A1F2E;
            line-height: 1.6;
            scroll-behavior: smooth;
            min-height: 100vh;
            background-color: #0A0F1F;
            background-image: url('Untitled image.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.92);
            z-index: -1;
        }
        
        .container { max-width: 1280px; margin: 0 auto; padding: 0 28px; }
        
        /* ===== REDESIGNED NAVIGATION ===== */
        header {
            background: rgba(10, 15, 31, 0.97);
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding: 0 20px;
            transition: all 0.3s ease;
        }
        
        .nav-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            flex-wrap: wrap;
            max-width: 1280px;
            margin: 0 auto;
        }
        
        /* Logo with glow effect */
        .logo {
            font-size: 26px;
            font-weight: 900;
            background: linear-gradient(135deg, #FFFFFF 0%, #60A5FA 50%, #A78BFA 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            position: relative;
        }
        
        .logo::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, #60A5FA, #A78BFA);
            border-radius: 2px;
            opacity: 0.3;
        }
        
        .logo-icon {
            background: linear-gradient(135deg, #3B82F6, #8B5CF6);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 18px;
            color: white;
        }
        
        /* Navigation Links with glass effect */
        nav ul {
            display: flex;
            gap: 8px;
            list-style: none;
            flex-wrap: wrap;
            align-items: center;
        }
        
        nav ul li a {
            color: #94A3B8;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            padding: 8px 16px;
            border-radius: 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            letter-spacing: 0.3px;
        }
        
        nav ul li a::before {
            content: '';
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%) scaleX(0);
            width: 60%;
            height: 2px;
            background: linear-gradient(90deg, #3B82F6, #8B5CF6);
            border-radius: 2px;
            transition: transform 0.3s ease;
        }
        
        nav ul li a:hover::before,
        nav ul li a.active::before {
            transform: translateX(-50%) scaleX(1);
        }
        
        nav ul li a:hover {
            color: #FFFFFF;
            background: rgba(255, 255, 255, 0.06);
        }
        
        nav ul li a.active {
            color: #FFFFFF;
            background: rgba(59, 130, 246, 0.15);
        }
        
        /* Cart Icon with animation */
        .cart-icon {
            color: #94A3B8;
            font-size: 1.2rem;
            position: relative;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 10px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .cart-icon:hover {
            color: #FFFFFF;
            background: rgba(255, 255, 255, 0.06);
        }
        
        .cart-badge {
            position: absolute;
            top: 2px;
            right: 2px;
            background: linear-gradient(135deg, #EF4444, #DC2626);
            color: white;
            font-size: 0.6rem;
            font-weight: 700;
            min-width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(239, 68, 68, 0.4);
            animation: pulse-badge 2s infinite;
        }
        
        @keyframes pulse-badge {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        /* Mobile menu button */
        .menu-toggle {
            display: none;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            color: #94A3B8;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .menu-toggle:hover {
            background: rgba(255,255,255,0.1);
            color: #FFFFFF;
        }
        
        /* ===== BUTTONS ===== */
        .btn-primary {
            background: linear-gradient(135deg, #1E293B 0%, #0F172A 100%);
            color: white;
            border: none;
            padding: 14px 36px;
            font-weight: 700;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        
        .btn-primary::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.6s ease;
        }
        
        .btn-primary:hover::after {
            left: 100%;
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.25);
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, #3B82F6, #8B5CF6);
            color: white;
            border: none;
            padding: 12px 28px;
            font-weight: 600;
            border-radius: 50px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }
        
        .btn-secondary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #10B981, #059669);
            color: white;
            border: none;
            padding: 14px 36px;
            font-weight: 700;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.3);
        }
        
        .btn-success:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(16, 185, 129, 0.4);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #EF4444, #DC2626);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .btn-danger:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
        }
        
        /* ===== HERO SECTION with glass effect ===== */
        .hero {
            background: linear-gradient(135deg, rgba(11, 17, 32, 0.75) 0%, rgba(17, 24, 39, 0.80) 100%);
            backdrop-filter: blur(10px);
            color: white;
            text-align: center;
            padding: 120px 24px 130px;
            border-radius: 40px;
            margin: 30px 0;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.06);
        }
        
        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at center, rgba(59, 130, 246, 0.05) 0%, transparent 70%);
            animation: hero-glow 10s ease-in-out infinite alternate;
        }
        
        @keyframes hero-glow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(5%, 5%) scale(1.1); }
        }
        
        .hero * { position: relative; z-index: 1; }
        
        .hero h1 {
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: -2px;
            background: linear-gradient(to right, #FFFFFF, #94A3F8, #A78BFA);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 24px;
            line-height: 1.1;
        }
        
        .hero p {
            font-size: 1.4rem;
            color: #CBD5E1;
            max-width: 680px;
            margin: 0 auto 36px;
            font-weight: 300;
        }
        
        .hero .hero-badge {
            display: inline-block;
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.2);
            padding: 6px 20px;
            border-radius: 50px;
            font-size: 0.8rem;
            color: #94A3F8;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        
        /* ===== SECTIONS ===== */
        section { padding: 80px 0; }
        
        .section-title {
            text-align: center;
            font-size: 2.6rem;
            font-weight: 800;
            margin-bottom: 50px;
            color: #0A0F1F;
            position: relative;
            letter-spacing: -1px;
        }
        
        .section-title:after {
            content: '';
            display: block;
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, #3B82F6, #8B5CF6);
            margin: 16px auto 0;
            border-radius: 4px;
        }
        
        .section-subtitle {
            text-align: center;
            color: #6B7280;
            max-width: 600px;
            margin: -30px auto 40px;
            font-size: 1.1rem;
        }
        
        /* ===== CARDS with glassmorphism ===== */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 32px; }
        
        .service-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 28px 24px 32px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 40px rgba(0,0,0,0.04);
            border: 1px solid rgba(255,255,255,0.3);
            text-align: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        
        .service-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.03), rgba(139, 92, 246, 0.03));
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        
        .service-card:hover::before {
            opacity: 1;
        }
        
        .service-card:hover {
            transform: translateY(-12px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            background: rgba(255, 255, 255, 0.95);
            border-color: rgba(59, 130, 246, 0.15);
        }
        
        .service-card .add-to-cart {
            margin-top: 16px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
        }
        
        .service-card:hover .add-to-cart {
            opacity: 1;
            transform: translateY(0);
        }
        
        .service-image {
            width: 100%;
            height: 180px;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #E6F0FF, #F0F4FF);
            position: relative;
        }
        
        .service-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        
        .service-card:hover .service-image img {
            transform: scale(1.05);
        }
        
        .service-price {
            font-size: 1.3rem;
            font-weight: 800;
            color: #3B82F6;
            margin: 10px 0;
        }
        
        .service-tag {
            position: absolute;
            top: 12px;
            right: 12px;
            background: linear-gradient(135deg, #3B82F6, #8B5CF6);
            color: white;
            padding: 4px 14px;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        /* ===== TESTIMONIALS ===== */
        .testimonial-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 32px 28px;
            transition: all 0.4s ease;
            box-shadow: 0 8px 40px rgba(0,0,0,0.04);
            border: 1px solid rgba(255,255,255,0.3);
            text-align: left;
        }
        
        .testimonial-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
        }
        
        .testimonial-text {
            font-style: italic;
            color: #1A1F2E;
            margin-bottom: 16px;
            line-height: 1.7;
            font-size: 1.05rem;
        }
        
        .testimonial-author {
            font-weight: 700;
            color: #0A0F1F;
        }
        
        .testimonial-company {
            font-size: 0.85rem;
            color: #6B7280;
        }
        
        .stars {
            color: #F59E0B;
            margin-bottom: 12px;
            font-size: 1.1rem;
            letter-spacing: 2px;
        }
        
        .testimonial-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3B82F6, #8B5CF6);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 1.2rem;
            margin-right: 14px;
        }
        
        .testimonial-header {
            display: flex;
            align-items: center;
            margin-top: 8px;
        }
        
        /* ===== INDUSTRY CARDS ===== */
        .industry-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 36px 24px;
            transition: all 0.4s ease;
            box-shadow: 0 8px 40px rgba(0,0,0,0.04);
            border: 1px solid rgba(255,255,255,0.3);
            text-align: center;
        }
        
        .industry-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            background: rgba(255, 255, 255, 0.95);
            border-color: rgba(59, 130, 246, 0.15);
        }
        
        .industry-card i {
            font-size: 2.8rem;
            background: linear-gradient(135deg, #3B82F6, #8B5CF6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 16px;
        }
        
        /* ===== TWO COLUMN LAYOUT ===== */
        .two-col-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 48px;
            align-items: start;
        }
        
        .feature-list { list-style: none; }
        .feature-list li {
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 14px;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(4px);
            padding: 14px 20px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.2);
            transition: 0.3s;
        }
        
        .feature-list li:hover {
            background: rgba(255, 255, 255, 0.95);
            transform: translateX(4px);
        }
        
        .feature-list li i {
            color: #3B82F6;
            font-size: 1.3rem;
            width: 28px;
            text-align: center;
        }
        
        /* ===== CONTACT ===== */
        .contact-flex {
            display: flex;
            flex-wrap: wrap;
            gap: 48px;
            background: rgba(248, 250, 254, 0.92);
            backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 48px;
            border: 1px solid rgba(255,255,255,0.3);
        }
        
        .contact-details { flex: 1.2; }
        .contact-details p {
            margin: 20px 0;
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 1.05rem;
        }
        .contact-details p i {
            width: 32px;
            color: #3B82F6;
            font-size: 1.2rem;
        }
        
        .contact-form { flex: 2; }
        .contact-form input, .contact-form textarea {
            width: 100%;
            padding: 16px 20px;
            margin-bottom: 18px;
            border: 2px solid #E2E8F0;
            border-radius: 16px;
            font-family: inherit;
            transition: 0.3s;
            background: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
        }
        
        .contact-form input:focus, .contact-form textarea:focus {
            outline: none;
            border-color: #3B82F6;
            box-shadow: 0 0 0 4px rgba(59,130,246,0.08);
            background: white;
        }
        
        /* ===== MAP ===== */
        .map-container {
            border-radius: 24px;
            overflow: hidden;
            margin-top: 30px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }
        .map-container iframe { width: 100%; height: 250px; border: 0; }
        
        /* ===== FLOATING BUTTONS ===== */
        .floating-wa {
            position: fixed;
            bottom: 80px;
            right: 24px;
            background: #25D366;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
            box-shadow: 0 4px 20px rgba(37, 211, 102, 0.4);
            transition: all 0.3s ease;
            z-index: 999;
            text-decoration: none;
        }
        .floating-wa:hover {
            transform: scale(1.1) rotate(-5deg);
            box-shadow: 0 8px 30px rgba(37, 211, 102, 0.5);
        }
        
        .floating-call {
            position: fixed;
            bottom: 20px;
            right: 24px;
            background: linear-gradient(135deg, #1E293B, #0F172A);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            z-index: 999;
            text-decoration: none;
        }
        .floating-call:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }
        
        /* ===== SOCIAL LINKS ===== */
        .social-links {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin: 30px 0 20px;
        }
        .social-links a {
            color: #6B7280;
            font-size: 1.4rem;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.05);
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .social-links a:hover {
            color: #FFFFFF;
            background: rgba(59, 130, 246, 0.2);
            transform: translateY(-4px);
            border-color: rgba(59, 130, 246, 0.2);
        }
        
        /* ===== FOOTER ===== */
        footer {
            background: rgba(10, 15, 31, 0.97);
            backdrop-filter: blur(20px);
            color: #94A3B8;
            text-align: center;
            padding: 40px 24px 30px;
            border-top: 1px solid rgba(255,255,255,0.06);
            margin-top: 40px;
        }
        
        .newsletter {
            background: rgba(255,255,255,0.05);
            border-radius: 60px;
            padding: 6px;
            display: flex;
            max-width: 450px;
            margin: 20px auto 0;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .newsletter input {
            flex: 1;
            border: none;
            padding: 14px 22px;
            border-radius: 60px;
            font-family: inherit;
            background: transparent;
            color: white;
        }
        .newsletter input::placeholder { color: #6B7280; }
        .newsletter button {
            background: linear-gradient(135deg, #3B82F6, #8B5CF6);
            border: none;
            padding: 14px 28px;
            border-radius: 60px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .newsletter button:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3);
        }
        
        /* ===== TOAST ===== */
        .toast-msg {
            position: fixed;
            bottom: 30px;
            left: 30px;
            background: #0F172A;
            color: white;
            padding: 14px 28px;
            border-radius: 60px;
            font-size: 0.95rem;
            z-index: 1200;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            animation: slideInUp 0.3s ease;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .toast-msg.error { background: #991b1b; }
        .toast-msg.success { background: #065f46; }
        
        @keyframes slideInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }

        cartFooter.style.display = 'block';
        let html = '';
        let total = 0;
        cart.forEach((item, index) => {
            const subtotal = item.price * item.quantity;
            total += subtotal;
            html += `
                <div class="cart-item">
                    <div class="cart-item-info">
                        <div class="cart-item-name">${item.name}</div>
                        <div class="cart-item-price">KES ${item.price.toLocaleString()}</div>

                    </div>
                </div>
            `;
        });
        cartItems.innerHTML = html;
        cartTotal.textContent = `KES ${total.toLocaleString()}`;
    }

    function updateQuantity(index, change) {
        if (cart[index]) {
            cart[index].quantity += change;
            if (cart[index].quantity <= 0) {
                cart.splice(index, 1);
            }
            updateCartUI();
            saveCart();
        }
    }

    function removeItem(index) {
        cart.splice(index, 1);
        updateCartUI();
        saveCart();
        showToast('🗑️ Item removed from cart');
    }

    function addToCart(service) {
        const existing = cart.find(item => item.id === service.id);
        if (existing) {
            existing.quantity += 1;
        } else {
            cart.push({ ...service, quantity: 1 });
        }
        updateCartUI();
        saveCart();
        showToast(`✅ ${service.name} added to cart!`);
    }

    function saveCart() {
        localStorage.setItem('cretechCart', JSON.stringify(cart));
    }

    function loadCart() {
        const saved = localStorage.getItem('cretechCart');
        if (saved) {
            try {
                cart = JSON.parse(saved);
                updateCartUI();
            } catch(e) { cart = []; }
        }
    }

    function clearCart() {
        cart = [];
        updateCartUI();
        saveCart();
        showToast('🗑️ Cart cleared');
    }

        if (cart.length === 0) {

        toast.className = `toast-msg ${type === 'error' ? 'error' : 'success'}`;
        const icon = type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle';
        toast.innerHTML = `<i class="fas ${icon}" style="margin-right: 10px;"></i>${msg}`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 4000);
    }

        try {
            const response = await fetch(FORMSPREE_ENDPOINT, { method: 'POST', body: formData, headers: { 'Accept': 'application/json' } });

            else return { success: false };
        } catch (error) { return { success: false }; }
    }

        e.preventDefault();

        const formData = new FormData();
        formData.append('name', name); formData.append('email', email);
        formData.append('message', `Phone: ${phone || 'Not provided'}\n\nMessage: ${message}`);
        formData.append('_subject', `Cretech Contact - ${name}`);

        if(result.success) { showToast(`✨ Thanks ${name}! We'll respond soon.`, 'success'); form.reset(); }

    }
    function renderAbout() { return `<section class="container"><h2 class="section-title">Company Overview</h2><p style="font-size:1.1rem;text-align:center;max-width:860px;margin:-10px auto 40px;background:rgba(255,255,255,0.7);padding:24px 32px;border-radius:24px;backdrop-filter:blur(4px);">Cretech Systems Limited is a forward-thinking security and technology solutions provider specializing in advanced facility protection systems, intelligent surveillance, smart automation, ICT networking, and solar energy solutions for modern environments.</p><div class="two-col-grid"><div style="background:rgba(248,250,254,0.85);backdrop-filter:blur(8px);padding:36px;border-radius:28px;border:1px solid rgba(255,255,255,0.3);"><div style="background:linear-gradient(135deg,#3B82F6,#8B5CF6);width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;margin-bottom:16px;"><i class="fas fa-bullseye" style="font-size:1.5rem;color:white;"></i></div><h3 style="margin:0 0 12px;">Our Mission</h3><p style="color:#4B5563;">To deliver superior physical and digital security systems through professional engineering, modern technology, and customer-centric service.</p></div><div style="background:rgba(248,250,254,0.85);backdrop-filter:blur(8px);padding:36px;border-radius:28px;border:1px solid rgba(255,255,255,0.3);"><div style="background:linear-gradient(135deg,#8B5CF6,#3B82F6);width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;margin-bottom:16px;"><i class="fas fa-eye" style="font-size:1.5rem;color:white;"></i></div><h3 style="margin:0 0 12px;">Our Vision</h3><p style="color:#4B5563;">To be the leading provider of innovative, dependable, and fully integrated security solutions that safeguard facilities and empower safer communities.</p></div></div><div style="margin-top:48px;text-align:center;background:rgba(255,255,255,0.7);padding:40px;border-radius:28px;backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,0.3);"><h3 style="margin-bottom:20px;font-size:1.5rem;">Core Values</h3><div style="display:flex;flex-wrap:wrap;justify-content:center;gap:10px;">${['Trust & Integrity','Innovation & Excellence','Customer-Centric Service','Professionalism & Reliability'].map(v => `<span style="background:rgba(59,130,246,0.08);border:1px solid rgba(59,130,246,0.1);border-radius:50px;padding:10px 22px;display:inline-block;font-weight:600;color:#1E293B;"><i class="fas fa-star" style="color:#3B82F6;margin-right:8px;"></i>${v}</span>`).join('')}</div></div></section>`; }
    function renderServices() { return `<div class="container"><h2 class="section-title">Our Expertise</h2><p class="section-subtitle">Explore our comprehensive range of security and automation solutions</p><div class="grid">${serviceData.map((s, index) => `
        <div class="service-card" onclick="addToCart({id:${index}, name:'${s.name}', price:${s.price}})">
            ${s.tag ? `<span class="service-tag">${s.tag}</span>` : ''}
            <div class="service-image"><img src="${s.image}" alt="${s.name}" loading="lazy" onerror="this.style.display='none'; this.parentElement.innerHTML='<i class=\\'${s.icon}\\' style=\\'font-size:3.5rem;color:#3B82F6;\\'></i>'"></div>
            <h3 style="font-size:1.2rem;">${s.name}</h3>
            <p style="font-size:0.9rem;color:#6B7280;">${s.desc}</p>
            <div class="service-price">KES ${s.price.toLocaleString()}</div>
            <button class="btn-secondary add-to-cart" onclick="event.stopPropagation(); addToCart({id:${index}, name:'${s.name}', price:${s.price}})"><i class="fas fa-cart-plus"></i> Add to Cart</button>
        </div>
    `).join('')}</div></div>`; }
    function renderIndustries() { return `<div class="container"><h2 class="section-title">Industries We Serve</h2><p class="section-subtitle">Tailored security and automation solutions for every sector</p><div class="grid">${['Residential Estates','Commercial Offices','Industrial Facilities','Government & Embassies','Hospitals & Schools','Hotels, Malls & Public Spaces','Transport Hubs'].map(ind => `<div class="industry-card"><i class="fas fa-industry"></i><h3 style="font-size:1.3rem;margin:8px 0;">${ind}</h3><p style="color:#6B7280;font-size:0.95rem;">Custom security & automation for ${ind.toLowerCase()} environments.</p></div>`).join('')}</div></div>`; }
    function renderPortfolio() { return `<div class="container"><h2 class="section-title">Recent Projects</h2><p class="section-subtitle">Real installations across Nairobi and beyond</p><div class="portfolio-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:28px;">${[{title:'CCTV Command Center - Westlands', icon:'fas fa-eye', bg:'rgba(59,130,246,0.08)', desc:'4K surveillance system'},{title:'Hydraulic Bollards - Gigiri', icon:'fas fa-arrow-down', bg:'rgba(139,92,246,0.08)', desc:'Vehicle access control'},{title:'ICT Cabling - CBD Office', icon:'fas fa-server', bg:'rgba(16,185,129,0.08)', desc:'Structured networking'},{title:'Smart Home Automation - Runda', icon:'fas fa-microchip', bg:'rgba(245,158,11,0.08)', desc:'Lighting & security'}].map(item => `<div class="portfolio-item" style="background:rgba(255,255,255,0.85);backdrop-filter:blur(8px);border-radius:28px;overflow:hidden;border:1px solid rgba(255,255,255,0.3);transition:0.3s;cursor:default;" onmouseover="this.style.transform='translateY(-4px)';this.style.boxShadow='0 20px 60px rgba(0,0,0,0.08)'" onmouseout="this.style.transform='';this.style.boxShadow=''"><div class="portfolio-img" style="background:${item.bg};height:180px;display:flex;align-items:center;justify-content:center;font-size:3.5rem;color:#3B82F6;"><i class="${item.icon}"></i></div><div class="portfolio-caption" style="padding:20px;background:rgba(255,255,255,0.95);text-align:center;"><strong style="font-size:1.05rem;">${item.title}</strong><p style="font-size:0.85rem;color:#6B7280;margin-top:4px;">${item.desc}</p></div></div>`).join('')}</div><p style="text-align:center;margin-top:40px;background:rgba(255,255,255,0.7);padding:16px 24px;border-radius:50px;backdrop-filter:blur(4px);max-width:600px;margin-left:auto;margin-right:auto;"><i class="fas fa-hard-hat" style="color:#3B82F6;"></i> Real installations across Nairobi — contact us for detailed case studies.</p></div>`; }
    function renderContact() { return `<div class="container"><h2 class="section-title">Get In Touch</h2><p class="section-subtitle">We'd love to hear about your security and automation needs</p><div class="contact-flex"><div class="contact-details"><h3 style="font-size:1.3rem;margin-bottom:16px;"><i class="fas fa-map-marker-alt" style="color:#3B82F6;"></i> Visit Us</h3><p><i class="fas fa-map-pin"></i> Westlands, Nairobi, Kenya</p><p><i class="fas fa-phone"></i> +254 724 083 199</p><p><i class="fas fa-envelope"></i> info.creationstechsolutions254@gmail.com</p><hr style="margin:20px 0;border-color:#E2E8F0;"><p><i class="fas fa-clock"></i> Mon-Fri: 8am - 6pm</p><p><i class="fas fa-headset"></i> 24/7 Emergency Support</p><div class="map-container"><iframe src="https://maps.google.com/maps?q=Westlands%2C%20Nairobi%2C%20Kenya&t=&z=14&ie=UTF8&iwloc=&output=embed" allowfullscreen loading="lazy"></iframe></div></div><div class="contact-form"><form id="mainContactForm"><input type="text" name="name" placeholder="Full Name *" required><input type="email" name="email" placeholder="Email Address *" required><input type="tel" name="phone" placeholder="Phone Number"><textarea name="message" rows="5" placeholder="Tell us about your security needs *" required></textarea><button type="submit"><i class="fas fa-paper-plane"></i> Send Message</button></form></div></div></div>`; }

    // Navigation
    let currentPage = "home";
    function updateActiveNav(pageId) { document.querySelectorAll('.nav-link').forEach(link => { if(link.getAttribute('data-page') === pageId) link.classList.add('active'); else link.classList.remove('active'); }); }
    function renderPage(page) {
        const app = document.getElementById('app-root'); if(!app) return;
        let content = page === 'home' ? renderHome() : page === 'about' ? renderAbout() : page === 'services' ? renderServices() : page === 'industries' ? renderIndustries() : page === 'portfolio' ? renderPortfolio() : page === 'contact' ? renderContact() : renderHome();
        app.innerHTML = content; updateActiveNav(page);
        if(page === 'home') { document.getElementById('quoteHeroBtn')?.addEventListener('click',()=>navigateTo('contact')); document.getElementById('learnMoreBtn')?.addEventListener('click',()=>navigateTo('about')); document.getElementById('contactRedirectBtn')?.addEventListener('click',()=>navigateTo('contact')); }
        if(page === 'contact') document.getElementById('mainContactForm')?.addEventListener('submit', handleContactSubmit);
    }
    function navigateTo(page) { currentPage = page; renderPage(page); window.scrollTo({ top: 0, behavior: 'smooth' }); history.pushState({ page }, '', `#${page}`); }
    function handleHashChange() { let hash = window.location.hash.slice(1); if(['home','about','services','industries','portfolio','contact'].includes(hash)) { currentPage = hash; renderPage(currentPage); } else { currentPage = 'home'; renderPage('home'); } }
    function bindGlobalNav() { document.querySelectorAll('.nav-link').forEach(link => { link.removeEventListener('click', link._listener); const handler = (e) => { e.preventDefault(); navigateTo(link.getAttribute('data-page')); }; link.addEventListener('click', handler); link._listener = handler; }); }
    const observer = new MutationObserver(() => bindGlobalNav());
    
    window.addEventListener('DOMContentLoaded', () => {
        loadCart();
        handleHashChange();
        bindGlobalNav();
        observer.observe(document.getElementById('app-root'), { childList: true, subtree: true });
        window.addEventListener('hashchange', handleHashChange);
        document.getElementById('newsletterBtn')?.addEventListener('click', () => { const email = document.getElementById('newsletterEmail')?.value; if(email && email.includes('@')) { showToast('🎉 Subscribed! Stay tuned for updates.'); document.getElementById('newsletterEmail').value = ''; } else showToast('Please enter a valid email', 'error'); });
    });
</script>
</body>
</html>
